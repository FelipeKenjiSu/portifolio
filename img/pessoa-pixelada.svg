<svg width="450" height="450" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="450" height="450" fill="#dbe4ee"/>
  <!-- grid de "pixels" de 30x30 formando um avatar simples -->
