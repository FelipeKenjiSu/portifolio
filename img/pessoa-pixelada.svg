  <rect x="120" y="90" width="30" height="90" fill="#4a3728"/>
  <rect x="300" y="90" width="30" height="90" fill="#4a3728"/>

  <!-- rosto -->
  <rect x="150" y="120" width="150" height="120" fill="#e8b98a"/>
  <rect x="120" y="150" width="30" height="60" fill="#e8b98a"/>
  <rect x="300" y="150" width="30" height="60" fill="#e8b98a"/>

